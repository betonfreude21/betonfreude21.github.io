  export class Form

    validate(formContainer)

      function isNull(e)

      }
    }
    
    reset(container)
    {
      for(let [d, def] of Object.entries(this.def))
      {
        this.getElement(container, d)?.classList.remove("is-error");
      }
    }
    
    getElement(container, key)
    {
      let e = container.querySelector(`.form-field[id="${key}"]`);;
      return e;
    }
    
    getValue(formContainer)
    {
      let res = {};
      for(let [d, def] of Object.entries(this.def))

    }
